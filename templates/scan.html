<!-- scan.html -->
{% extends "base.html" %}
{% block title %}Packing Scan{% endblock %}
{% block body %}
<div class="app-wrap">

  <!-- Header -->
  <header class="app-header">
    <div class="header-left">
      <span class="logo-icon">📦</span>
      <span class="header-title">Faceware Final Visual Inspection Scanning</span>
    </div>
    <div class="header-right">
      <span class="operator-badge">👤 {{ operator_en }}</span>
      <select id="sel-shift" class="sel-shift">
        <option value="A">A</option>
        <option value="B">B</option>
      </select>
      <button class="btn-ghost" id="btn-logout">Logout</button>
    </div>
  </header>

  <!-- Scan Input -->
  <div class="scan-section">
    <div class="scan-row">
      <input id="scan-serial" class="scan-input" type="text"
             placeholder="Scan serial number…" autocomplete="off" autofocus />
      <button id="btn-scan-serial" class="btn-primary btn-scan">SCAN</button>
    </div>
    <div id="scan-msg-prog" class="scan-msg hidden"></div>
  </div>
  <div class="scan-section">

    <!-- Pass / Fail buttons, shown after serial is verified -->
    <div id="decision-row" class="scan-row hidden">
      <button id="btn-pass" class="btn-primary btn-pass">✅ PASS</button>
      <button id="btn-fail" class="btn-primary btn-fail">❌ FAIL</button>
    </div>

    <!-- Fail reason input, shown only when FAIL is clicked -->
    <div id="fail-reason-row" class="scan-row hidden">
      <input id="fail-reason" class="scan-input" type="text"
             placeholder="Enter reason for fail…" autocomplete="off" />
      <button id="btn-submit-fail" class="btn-primary btn-fail">SUBMIT FAIL</button>
      <button id="btn-cancel-fail" class="btn-ghost">Cancel</button>
    </div>
  </div>

  <!-- Log Table -->
  <div class="log-section">
    <div class="log-header">
      <h2>Scan Log</h2>
      <button class="btn-ghost btn-sm" id="btn-clear-log">Clear Log</button>
    </div>
    <div class="table-wrap">
      <table class="log-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Serial Number</th>
            <th>PO Number</th>
            <th>Status</th>
            <th>Message</th>
            <th>Time</th>
          </tr>
        </thead>
        <tbody id="log-body">
          <tr id="empty-row"><td colspan="6" class="empty-log">No scans yet. Start scanning above.</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script>
  const TRAY_LIMIT = {{ tray_limit }};
  let count = 0;
  let logRows = [];
  // let verifiedProgId = null;   // holds the prog_id once step 1 passes
  let verifiedSerial  = null;  // holds the serial once step 2 passes

  const countEl   = document.getElementById("count-current");
  const trayBar   = document.getElementById("tray-bar");
  const trayLbl   = document.getElementById("tray-status");

  // const scanProgId  = document.getElementById("scan-prog-id");
  const scanSerial  = document.getElementById("scan-serial");
  const msgProg     = document.getElementById("scan-msg-prog");
  const msgSerial   = msgProg;
  const logBody     = document.getElementById("log-body");
  const emptyRow    = document.getElementById("empty-row");
  const shiftSel    = document.getElementById("sel-shift");
  // const btnProg     = document.getElementById("btn-scan-prog");
  const btnSerial   = document.getElementById("btn-scan-serial");

  const decisionRow   = document.getElementById("decision-row");
  const btnPass        = document.getElementById("btn-pass");
  const btnFail         = document.getElementById("btn-fail");
  const failReasonRow  = document.getElementById("fail-reason-row");
  const failReasonInput = document.getElementById("fail-reason");
  const btnSubmitFail  = document.getElementById("btn-submit-fail");
  const btnCancelFail  = document.getElementById("btn-cancel-fail");

  function showMsg(el, text, type) {
    el.textContent = text;
    el.className = "scan-msg " + type;
    clearTimeout(el._t);
    el._t = setTimeout(() => el.className = "scan-msg hidden", 4000);
  }

  function addLogRow(serial, po, status, message) {
    emptyRow.style.display = "none";
    const idx  = logRows.length + 1;
    const time = new Date().toLocaleTimeString();
    const tr   = document.createElement("tr");
    tr.className = "log-row-" + status;
    tr.innerHTML = `
      <td>${idx}</td>
      <td class="mono">${serial}</td>
      <td class="mono">${po || "—"}</td>
      <td><span class="badge badge-${status}">${status.toUpperCase()}</span></td>
      <td>${message}</td>
      <td>${time}</td>
    `;
    logBody.prepend(tr);
    logRows.push(tr);
  }


  async function doVerifySerial() {
    const serial = scanSerial.value.trim();
    if (!serial) { showMsg(msgSerial, "Please enter a serial number.", "error"); return; }

    btnSerial.disabled = true;

    const res  = await fetch("/api/scan", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ serial_num: serial })//prog_id: verifiedProgId, 
    });
    const data = await res.json();

    btnSerial.disabled = false;
    showMsg(msgSerial, data.message, data.ok ? "success" : "error");

    if (data.ok) {
      verifiedSerial = serial;
      scanSerial.disabled = true;
      decisionRow.classList.remove("hidden");
    } else {
      scanSerial.value = "";
      scanSerial.focus();
    }
  }

  async function submitDecision(decision, remarks = "") {
    const res  = await fetch("/api/scan-decision", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        // prog_id: verifiedProgId,
        serial_num: verifiedSerial,
        decision,
        shift: shiftSel.value,
        remarks,
      })
    });
    const data = await res.json();

    const statusMap = { ok: "ok", already_packed: "warn", fail: "fail", not_found: "fail", mismatch: "fail" };
    const uiStatus  = statusMap[data.status] || "fail";
    const loggedSerial = decision === "fail" ? (data.fail_serial || `${verifiedSerial}_1`) : verifiedSerial;

    showMsg(msgSerial, data.message, data.ok ? "success" : "error");

    if (data.ok) {
      addLogRow(loggedSerial, data.unit?.po_num, uiStatus, data.message);
      count += 1;
      resetScanState();
    } else {
      // validation failed on re-check (e.g. stale state) — surface it, keep reason box open on fail
      addLogRow(verifiedSerial, data.unit?.po_num, uiStatus, data.message);
    }
  }

  btnSerial.addEventListener("click", doVerifySerial);
  scanSerial.addEventListener("keydown", e => { if (e.key === "Enter") doVerifySerial(); });

  btnPass.addEventListener("click", () => submitDecision("pass"));

  btnFail.addEventListener("click", () => {
    decisionRow.classList.add("hidden");
    failReasonRow.classList.remove("hidden");
    failReasonInput.focus();
  });

  btnCancelFail.addEventListener("click", () => {
    failReasonRow.classList.add("hidden");
    failReasonInput.value = "";
    decisionRow.classList.remove("hidden");
  });

  btnSubmitFail.addEventListener("click", () => {
    const reason = failReasonInput.value.trim();
    if (!reason) { showMsg(msgSerial, "Please enter a fail reason.", "error"); return; }
    submitDecision("fail", reason);
  });
  failReasonInput.addEventListener("keydown", e => { if (e.key === "Enter") btnSubmitFail.click(); });

  function resetScanState() {
    verifiedSerial = null;
    scanSerial.value = "";
    scanSerial.disabled = false;
    decisionRow.classList.add("hidden");
    failReasonRow.classList.add("hidden");
    failReasonInput.value = "";
    scanSerial.focus();
  }

  document.getElementById("btn-clear-log").addEventListener("click", () => {
    logRows.forEach(r => r.remove());
    logRows = [];
    emptyRow.style.display = "";
  });

  document.getElementById("btn-logout").addEventListener("click", async () => {
    await fetch("/api/logout", { method: "POST" });
    window.location.href = "/login";
  });
</script>
{% endblock %}
